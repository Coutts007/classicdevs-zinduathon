# Template: the nginx image substitutes ${PORT} at start (RumptyCloud and most PaaS set it).
# SPA hosting: hashed assets cached for a year, index.html never cached, deep links fall back to
# index.html so React Router handles them. Security headers come from security-headers.conf.
server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Written at container start from the environment (docker/40-runtime-config.sh).
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
