<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050507" />
    <meta
      name="description"
      content="SkillProof reads your public GitHub work and shows recruiters the evidence behind every skill."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/config.js"></script>
    <title>SkillProof · Proof of skill for the AI era</title>
  </head>
  <body style="background: #050507">
    <!-- Painted before any JavaScript runs (fast first paint on slow phones); React replaces it. -->
    <div id="root">
      <div
        role="status"
        aria-label="Loading SkillProof"
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #050507;
          color: #f4f4f5;
          font:
            600 15px/1 system-ui,
            sans-serif;
        "
      >
        <span
          style="
            padding: 12px 20px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
          "
          >SkillProof</span
        >
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
