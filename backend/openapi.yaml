components:
  schemas:
    AdminSkill:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          $ref: '#/components/schemas/SkillCategoryEnum'
      required:
      - category
      - name
    AdminSkillRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          $ref: '#/components/schemas/SkillCategoryEnum'
        aliases:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          writeOnly: true
      required:
      - category
      - name
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        phone:
          type: string
          nullable: true
          description: E.164, e.g. +254712345678
          maxLength: 16
        isActive:
          type: boolean
        emailVerified:
          type: boolean
          readOnly: true
        phoneVerified:
          type: boolean
          readOnly: true
        githubLogin:
          type: string
          nullable: true
          readOnly: true
        approvalStatus:
          type: string
          nullable: true
          readOnly: true
        company:
          type: string
          nullable: true
          readOnly: true
        lastLogin:
          type: string
          format: date-time
          nullable: true
        dateJoined:
          type: string
          format: date-time
      required:
      - approvalStatus
      - company
      - email
      - emailVerified
      - githubLogin
      - id
      - phoneVerified
    AnalysisCreateRequest:
      type: object
      properties:
        githubLogin:
          type: string
          minLength: 1
          description: 'Admins only: the GitHub login to analyse. Job seekers always
            analyse their own.'
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$
        force:
          type: boolean
          default: false
          description: Ignore a result under 24 h old.
    AnalysisDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        githubLogin:
          type: string
        status:
          $ref: '#/components/schemas/AnalysisStatusEnum'
        progressStep:
          type: integer
          description: 1 reading repos · 2 reading commits · 3 finding skills · 4
            scoring
        errorCode:
          type: string
        errorMessage:
          type: string
        signalScore:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        card:
          allOf:
          - $ref: '#/components/schemas/Card'
          nullable: true
        tips:
          type: array
          items:
            type: string
          description: Owner and admins only; empty for others.
      required:
      - card
      - completedAt
      - createdAt
      - errorCode
      - errorMessage
      - githubLogin
      - id
      - progressStep
      - signalScore
      - status
      - tips
    AnalysisListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        githubLogin:
          type: string
        status:
          type: string
        signalScore:
          type: integer
          nullable: true
        subScores:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - completedAt
      - createdAt
      - githubLogin
      - id
      - signalScore
      - status
      - subScores
    AnalysisStarted:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
      required:
      - id
      - status
    AnalysisStatusEnum:
      enum:
      - queued
      - running
      - completed
      - failed
      type: string
      description: |-
        * `queued` - queued
        * `running` - running
        * `completed` - completed
        * `failed` - failed
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - suspended
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `suspended` - Suspended
    AuditLog:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          nullable: true
          readOnly: true
        action:
          type: string
          maxLength: 64
        targetType:
          type: string
          maxLength: 64
        targetId:
          type: string
          maxLength: 64
        metadata: {}
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          maxLength: 512
      required:
      - action
      - actor
      - createdAt
    AuthResponse:
      type: object
      description: Same shape from register, login and the GitHub callback.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    Candidate:
      type: object
      properties:
        githubLogin:
          type: string
        name:
          type: string
        headline:
          type: string
        location:
          type: string
        avatarUrl:
          type: string
        openToWork:
          type: boolean
        signalScore:
          type: integer
        analysedAt:
          type: string
          format: date-time
        topSkills:
          type: array
          items:
            $ref: '#/components/schemas/TopSkill'
      required:
      - analysedAt
      - avatarUrl
      - githubLogin
      - headline
      - location
      - name
      - openToWork
      - signalScore
      - topSkills
    CandidateDetail:
      type: object
      properties:
        candidate:
          $ref: '#/components/schemas/Candidate'
        card:
