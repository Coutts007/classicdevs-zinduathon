          description: 'Not allowed: `permission_denied`'
    post:
      operationId: analyses_create
      description: 'Job seekers analyse their own linked GitHub account (email must
        be verified). Admins pass `githubLogin`. Returns `202 {id, status}` and runs
        in the background: poll `GET /analyses/{id}`. A completed analysis under 24
        h old is returned instead (`200`, with the card) unless `force` is true or
        the claimed skills changed. Only one analysis per login runs at a time. Throttled
        to 10 per hour.'
