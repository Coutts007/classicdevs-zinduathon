openapi: 3.0.3
info:
  title: SkillProof API
  version: 0.1.0
  description: |-
    SkillProof turns a developer's public GitHub history into an explained skill card: proven skills, a Signal Score built from five rule-based sub-scores, and the evidence behind each number. Recruiters search and give feedback; job seekers receive it in-app, by email and by SMS.

    Conventions: JSON with camelCase keys, `Authorization: Bearer <access token>`, page-number pagination (`?page=&pageSize=`), errors shaped `{code, message, fields?}`.
paths:
  /api/v1/admin/audit-log:
    get:
      operationId: admin_audit_log_retrieve
      summary: Audit log
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action or prefix ending in '.' (e.g. `auth.`)
      - in: query
        name: actor
        schema:
          type: string
        description: Actor email (contains)
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
        description: ISO 8601
      - in: query
        name: until
        schema:
          type: string
        description: ISO 8601
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: …
                  summary: not_authenticated
          description: 'Not signed in or token invalid: `not_authenticated`'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:
                    code: permission_denied
                    message: …
                  summary: permission_denied
          description: 'Not allowed: `permission_denied`'
  /api/v1/admin/dependency-mappings:
    get:
      operationId: admin_dependency_mappings_retrieve
      summary: Dependency mappings
      parameters:
      - in: query
        name: ecosystem
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      tags:
      - Admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDependencyMappingList'
          description: ''
    post:
      operationId: admin_dependency_mappings_create
      description: 'e.g. `{ecosystem: npm, packageName: svelte, skill: Svelte}`. Used
        from the next analysis.'
      summary: Map a package to a skill
      tags:
      - Admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyMappingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DependencyMappingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DependencyMappingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyMapping'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
  /api/v1/admin/dependency-mappings/{ecosystem}/{package}:
