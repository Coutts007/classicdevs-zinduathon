              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: …
                  summary: not_authenticated
          description: 'Not signed in or token invalid: `not_authenticated`'
    delete:
      operationId: me_destroy
      description: Permanently deletes your account and personal data, and signs you
        out everywhere. Send your password; accounts without one must have signed
        in with GitHub in the last 10 minutes. Feedback you sent as a recruiter stays
        with its recipient, anonymised. Admin accounts are removed by another admin.
