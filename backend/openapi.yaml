          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFound:
                  value:
                    code: not_found
                    message: …
                  summary: not_found
          description: 'Not found: `not_found`'
