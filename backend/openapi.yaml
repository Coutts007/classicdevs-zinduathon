            $ref: '#/components/schemas/Skill'
    PasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - newPassword
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - newPassword
      - token
    PatchedAdminSkillRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          $ref: '#/components/schemas/SkillCategoryEnum'
        aliases:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          writeOnly: true
    PatchedAdminUserUpdateRequest:
      type: object
      properties:
        isActive:
          type: boolean
          description: False suspends and signs the user out
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedDependencyMappingRequest:
      type: object
      properties:
        ecosystem:
          $ref: '#/components/schemas/EcosystemEnum'
        packageName:
          type: string
          minLength: 1
          description: Normalised lowercase name
          maxLength: 214
        skill:
          type: string
          minLength: 1
    PatchedJobWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        location:
          type: string
          maxLength: 120
        employmentType:
          allOf:
          - $ref: '#/components/schemas/EmploymentTypeEnum'
          default: full_time
        remotePolicy:
          allOf:
          - $ref: '#/components/schemas/RemotePolicyEnum'
          default: onsite
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatusEnum'
          default: draft
        closesAt:
          type: string
          format: date-time
          nullable: true
        requiredSkills:
          type: array
          items:
            $ref: '#/components/schemas/RequiredSkillRequest'
        companyId:
          type: string
          format: uuid
          description: Admins only
    PatchedMeUpdateRequest:
      type: object
      description: Flat PATCH body; fields are routed to the user or the role profile.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          nullable: true
        headline:
          type: string
          maxLength: 160
        location:
          type: string
          maxLength: 120
        cardVisible:
          type: boolean
        openToWork:
          type: boolean
        jobTitle:
          type: string
          maxLength: 120
    PatchedShortlistUpdateRequest:
      type: object
      properties:
        stage:
          $ref: '#/components/schemas/ShortlistStageEnum'
        note:
          type: string
          maxLength: 500
        notifyCandidate:
          type: boolean
          default: false
        feedbackMessage:
          type: string
          description: Also send feedback (e.g. when moving to interview)
    PhoneSendCodeRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: 'Optional: set or change the number before sending the code.'
    PhoneSendCodeResponse:
      type: object
      properties:
        phone:
          type: string
        expiresAt:
          type: string
          format: date-time
        devCode:
          type: string
          description: Only in local development while SMS is dry-run.
      required:
      - expiresAt
      - phone
    PhoneVerifyRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^\s*\d{6}\s*$
      required:
      - code
    PreferenceChangeChannelEnum:
      enum:
      - in_app
      - email
      - sms
      type: string
      description: |-
        * `in_app` - in_app
        * `email` - email
        * `sms` - sms
    PreferenceChangeKindEnum:
      enum:
      - analysis_completed
      - analysis_failed
      - recruiter_feedback
      - recruiter_approved
      - recruiter_rejected
      - shortlisted
      - profile_viewed_digest
      type: string
      description: |-
        * `analysis_completed` - analysis_completed
        * `analysis_failed` - analysis_failed
        * `recruiter_feedback` - recruiter_feedback
        * `recruiter_approved` - recruiter_approved
        * `recruiter_rejected` - recruiter_rejected
        * `shortlisted` - shortlisted
        * `profile_viewed_digest` - profile_viewed_digest
    PreferenceChangeRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/PreferenceChangeKindEnum'
        channel:
          $ref: '#/components/schemas/PreferenceChangeChannelEnum'
        enabled:
          type: boolean
      required:
      - channel
      - enabled
      - kind
    PreferenceMatrix:
      type: object
      properties:
        matrix:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: boolean
          description: kind → channel → enabled. Only kinds for your role and channels
            that exist.
        smsReady:
          type: boolean
          description: Phone verified and SMS consent given.
      required:
      - matrix
      - smsReady
    PreferenceUpdateRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceChangeRequest'
      required:
      - preferences
    ProfileViewWeek:
      type: object
      properties:
        weekStart:
          type: string
          format: date
        recruiters:
          type: integer
      required:
      - recruiters
      - weekStart
    ProfileViews:
      type: object
      properties:
        thisWeek:
          type: integer
          description: Distinct recruiters in the last 7 days
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/ProfileViewWeek'
      required:
      - thisWeek
      - weeks
    ProviderEnum:
      enum:
      - smtp
      - thrivewave
      type: string
      description: |-
        * `smtp` - SMTP
        * `thrivewave` - Thrivewave
    ReadAll:
      type: object
      properties:
        updated:
          type: integer
      required:
      - updated
    RecruiterProfile:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/Company'
        jobTitle:
          type: string
          maxLength: 120
        approvalStatus:
          $ref: '#/components/schemas/ApprovalStatusEnum'
        reviewNote:
          type: string
          maxLength: 500
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - company
    RecruiterQueue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        emailVerified:
          type: boolean
        company:
          type: string
        jobTitle:
          type: string
        approvalStatus:
          type: string
        reviewNote:
          type: string
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
      - approvalStatus
      - company
      - createdAt
      - email
      - emailVerified
      - fullName
      - id
      - jobTitle
      - reviewNote
      - reviewedAt
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        role:
          $ref: '#/components/schemas/SignupRoleEnum'
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          nullable: true
        companyName:
          type: string
          maxLength: 120
        jobTitle:
          type: string
          maxLength: 120
        consents:
          $ref: '#/components/schemas/ConsentsRequest'
      required:
      - consents
      - email
      - fullName
      - password
      - role
    RemotePolicyEnum:
      enum:
      - onsite
      - hybrid
      - remote
      type: string
      description: |-
        * `onsite` - On-site
        * `hybrid` - Hybrid
        * `remote` - Remote
    RequiredSkill:
      type: object
      properties:
        skill:
          type: string
          description: Name, slug or alias
        minimumLabel:
          allOf:
          - $ref: '#/components/schemas/MinimumLabelEnum'
          default: moderate
        weight:
          type: integer
          maximum: 3
          minimum: 1
          default: 1
      required:
      - skill
    RequiredSkillRequest:
      type: object
      properties:
        skill:
          type: string
          minLength: 1
          description: Name, slug or alias
        minimumLabel:
          allOf:
          - $ref: '#/components/schemas/MinimumLabelEnum'
          default: moderate
        weight:
          type: integer
          maximum: 3
          minimum: 1
          default: 1
      required:
      - skill
    ReviewRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 500
    RoleEnum:
      enum:
      - job_seeker
      - recruiter
      - admin
      type: string
      description: |-
        * `job_seeker` - Job seeker
        * `recruiter` - Recruiter
        * `admin` - Admin
    Shortlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        candidate:
          allOf:
          - $ref: '#/components/schemas/ShortlistCandidate'
          readOnly: true
        jobPosting:
          allOf:
          - $ref: '#/components/schemas/JobRef'
          nullable: true
        stage:
          $ref: '#/components/schemas/ShortlistStageEnum'
        note:
          type: string
          description: Private to the recruiter
          maxLength: 500
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - candidate
      - createdAt
      - id
      - jobPosting
      - updatedAt
    ShortlistCandidate:
      type: object
      properties:
        githubLogin:
          type: string
        name:
          type: string
        headline:
          type: string
      required:
      - githubLogin
      - headline
      - name
    ShortlistCreateRequest:
      type: object
      properties:
        githubLogin:
          type: string
          minLength: 1
        jobPostingId:
          type: string
          format: uuid
          nullable: true
        stage:
          allOf:
          - $ref: '#/components/schemas/ShortlistStageEnum'
          default: saved
        note:
          type: string
          default: ''
          maxLength: 500
        notifyCandidate:
          type: boolean
          default: false
          description: Tell the job seeker (in-app, email, SMS)
      required:
      - githubLogin
    ShortlistStageEnum:
      enum:
      - saved
      - contacted
      - interview
      - offer
      - rejected
      type: string
      description: |-
        * `saved` - Saved
        * `contacted` - Contacted
        * `interview` - Interview
        * `offer` - Offer
        * `rejected` - Rejected
    SignupRoleEnum:
      enum:
      - job_seeker
      - recruiter
      type: string
      description: |-
        * `job_seeker` - job_seeker
        * `recruiter` - recruiter
    Skill:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        category:
          $ref: '#/components/schemas/SkillCategoryEnum'
      required:
      - category
      - name
      - slug
    SkillCategoryEnum:
      enum:
      - language
      - framework
      - practice
      - tool
      type: string
      description: |-
        * `language` - Language
        * `framework` - Framework
        * `practice` - Practice
        * `tool` - Tool
    Stats:
      type: object
      properties:
        usersByRole:
          type: object
          additionalProperties:
            type: integer
        pendingRecruiters:
          type: integer
        analysesPerDay:
          type: array
          items:
            type: object
            additionalProperties: {}
        averageSignalScore:
          type: number
          format: double
          nullable: true
        feedbackSent:
          type: integer
        feedbackHeld:
          type: integer
        deliveryRates:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          description: 'Per channel: total, ok (sent/delivered/dry run), failed, skipped,
            rate'
      required:
      - analysesPerDay
      - averageSignalScore
      - deliveryRates
      - feedbackHeld
      - feedbackSent
      - pendingRecruiters
      - usersByRole
    SubScoreValue:
      type: object
      properties:
        value:
          type: integer
          maximum: 20
          minimum: 0
        reason:
          type: string
      required:
      - reason
      - value
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: The token from the emailed link.
      required:
      - token
    TopSkill:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
      required:
      - label
      - name
    TypeEnum:
      enum:
      - one_shot_dump
      - unexplained_bulk
      - tutorial_clone
      - unverified_claim
      type: string
      description: |-
        * `one_shot_dump` - one_shot_dump
        * `unexplained_bulk` - unexplained_bulk
        * `tutorial_clone` - tutorial_clone
        * `unverified_claim` - unverified_claim
    WebhookAck:
      type: object
      properties:
        ok:
          type: boolean
        updated:
          type: boolean
      required:
      - ok
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: System
  description: Health and version
- name: Auth
